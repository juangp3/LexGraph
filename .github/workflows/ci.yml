name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Component tests
        run: npm run test:component

      - name: Functional tests
        run: npm run test:functional

  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lexgraph
          POSTGRES_USER: lexgraph
          POSTGRES_PASSWORD: lexgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexgraph -d lexgraph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://lexgraph:lexgraph@localhost:5432/lexgraph
        run: npm run db:migrate

      - name: Integration tests
        env:
          RUN_INTEGRATION: "true"
          DATABASE_URL: postgresql://lexgraph:lexgraph@localhost:5432/lexgraph
        run: npm run test:integration

  system-smoke:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: System smoke tests
        run: npm run test:system
