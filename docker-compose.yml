services:
  postgres:
    image: postgres:17
    container_name: lexgraph-postgres
    environment:
      POSTGRES_DB: lexgraph
      POSTGRES_USER: lexgraph
      POSTGRES_PASSWORD: lexgraph
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro

  apache-age:
    image: apache/age:latest
    container_name: lexgraph-age
    environment:
      POSTGRES_DB: lexgraph
      POSTGRES_USER: lexgraph
      POSTGRES_PASSWORD: lexgraph
    ports:
      - "5434:5432"
    volumes:
      - ./scripts/db/init-age.sql:/docker-entrypoint-initdb.d/01-init-age.sql:ro

  redis:
    image: redis:7-alpine
    container_name: lexgraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: lexgraph-api
    environment:
      DATABASE_URL: postgresql://lexgraph:lexgraph@postgres:5432/lexgraph
      PORT: 3000
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: lexgraph-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
