services:
  postgres:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    container_name: lexgraph-postgres
    environment:
      POSTGRES_DB: lexgraph
      POSTGRES_USER: lexgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
      - ./scripts/db/init-age.sql:/docker-entrypoint-initdb.d/02-init-age.sql:ro

  redis:
    image: redis:7-alpine
    container_name: lexgraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: lexgraph-api
    environment:
      DATABASE_URL: postgresql://lexgraph:${POSTGRES_PASSWORD}@postgres:5432/lexgraph
      PORT: 3001
      FRONTEND_URLS: https://wordroots.vercel.app,https://wordroots.duckdns.org
      GRAPH_MAX_DEPTH: 4
      GRAPH_MAX_NODES: 500
      GRAPH_MAX_EDGES: 1000
      GRAPH_MAX_LIMIT: 100
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  caddy:
    image: caddy:2-alpine
    container_name: lexgraph-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
volumes:
  postgres_data:
  redis_data:
  caddy_data:
