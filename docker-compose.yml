services:
  postgres:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    container_name: lexgraph-postgres
    environment:
      POSTGRES_DB: lexgraph
      POSTGRES_USER: lexgraph
      POSTGRES_PASSWORD: lexgraph
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
      - ./scripts/db/init-age.sql:/docker-entrypoint-initdb.d/02-init-age.sql:ro

  redis:
    image: redis:7-alpine
    container_name: lexgraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: lexgraph-api
    environment:
      DATABASE_URL: postgresql://lexgraph:lexgraph@postgres:5432/lexgraph
      PORT: 3001
      FRONTEND_URLS: http://localhost:3000,http://127.0.0.1:3000
      GRAPH_MAX_DEPTH: 4
      GRAPH_MAX_NODES: 500
      GRAPH_MAX_EDGES: 1000
      GRAPH_MAX_LIMIT: 100
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
